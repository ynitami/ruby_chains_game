# メソッドカード定義
# category: A(主力), B(ユーティリティ), C(ジェネレーター), D(切り札)
# code_fragment: サーバーがチェイン組み立て時にそのまま使うコード断片
# proc_compatible: &:method_name として切り札のProc引数に使えるか
# wild: 切り札（ブロック引数を取るメソッド）であるか

# === A. 主力 ===
- id: m_chars
  name: ".chars"
  category: A
  code_fragment: ".chars"
  description: "文字列を1文字ずつの配列に変換"
  proc_compatible: true
  wild: false

- id: m_digits
  name: ".digits"
